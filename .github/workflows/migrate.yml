name: Supabase Migrate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Use the transaction-pooler connection directly. The platform-managed
      # temporary CLI role is unavailable on this legacy project, while direct
      # db push is supported and was verified against production.
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --skip-vault
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
